<div class="login-wrap">
  <div class="card-login">
    <div class="logo">B</div>
    <h1>BotSaaS</h1>
    <p class="sub">Painel do dono</p>

    <form (ngSubmit)="onSubmit()">
      <input class="input" type="email" name="email" placeholder="Email" [(ngModel)]="email" required />
      <input class="input" type="password" name="password" placeholder="Senha" [(ngModel)]="password" required />
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </div>
</div>
