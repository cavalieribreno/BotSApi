  <div class="main">
    <header class="topbar">
      <div class="user">
        <span class="avatar">{{ initial }}</span>
        <span class="who">
          <span class="email">{{ email }}</span>
          <span class="role">Dono</span>

      <button class="btn btn-ghost" (click)="logout()">Sair</button>
