<div class="min-h-screen w-full flex items-center justify-center p-4 bg-[#F6F6F6] relative">
  <!-- Efeito sutil de luz de fundo -->
  <div class="absolute w-96 h-96 bg-amber-500/5 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md bg-white border border-barber-border rounded-3xl p-8 sm:p-10 shadow-floating relative z-10">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-barber-black text-white rounded-2xl flex items-center justify-center font-display font-bold text-xl mx-auto mb-4 shadow-sm">
        BR
      </div>
      <h1 class="font-display font-bold text-2xl text-barber-black tracking-tight">BarberRoom</h1>
      <p class="text-barber-mute text-sm mt-1">Acesse a gestão inteligente do seu negócio</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-barber-black uppercase tracking-wider mb-1.5" for="email">
          E-mail
        </label>
        <div class="relative">
          <i class="ph ph-envelope-simple absolute left-3.5 top-1/2 -translate-y-1/2 text-barber-mute text-lg"></i>
          <input 
            id="email"
            class="w-full pl-10 pr-4 py-3 bg-barber-bg border border-barber-border rounded-xl text-sm text-barber-black placeholder:text-zinc-400 focus:outline-none focus:border-barber-black focus:ring-1 focus:ring-barber-black transition-all shadow-sm"
            type="email" 
            name="email" 
            placeholder="barberteste@teste.com" 
            [(ngModel)]="email" 
            required 
            autocomplete="email"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-barber-black uppercase tracking-wider mb-1.5" for="password">
          Senha
        </label>
        <div class="relative">
          <i class="ph ph-lock-key absolute left-3.5 top-1/2 -translate-y-1/2 text-barber-mute text-lg"></i>
          <input 
            id="password"
            class="w-full pl-10 pr-4 py-3 bg-barber-bg border border-barber-border rounded-xl text-sm text-barber-black placeholder:text-zinc-400 focus:outline-none focus:border-barber-black focus:ring-1 focus:ring-barber-black transition-all shadow-sm"
            type="password" 
            name="password" 
            placeholder="••••••" 
            [(ngModel)]="password" 
            required 
            autocomplete="current-password"
          />
        </div>
      </div>

      <!-- Erro -->
      @if (error()) {
        <div class="p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-medium flex items-center gap-2">
          <i class="ph-fill ph-warning-circle text-base shrink-0"></i>
          <span>{{ error() }}</span>
        </div>
      }

      <!-- Botão de Login -->
      <button 
        type="submit" 
        [disabled]="loading()"
        class="w-full bg-barber-black hover:bg-zinc-800 text-white rounded-xl py-3.5 font-semibold text-sm shadow-sm transition-all flex items-center justify-center gap-2 disabled:opacity-60 cursor-pointer mt-2">
        @if (loading()) {
          <i class="ph ph-circle-notch text-lg animate-spin"></i>
          <span>Entrando...</span>
        } @else {
          <span>Entrar no Painel</span>
          <i class="ph-bold ph-arrow-right text-base"></i>
        }
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-8 pt-6 border-t border-barber-border text-center">
      <p class="text-xs text-barber-mute flex items-center justify-center gap-1.5">
        <i class="ph-fill ph-lock text-zinc-400"></i>
        Ambiente seguro • Powered by BotSaaS
      </p>
    </div>
  </div>
</div>
